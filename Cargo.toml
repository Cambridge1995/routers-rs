[package]
# 发布名:routers(crates.io)已被占用,用 routers-rs;lib 名保留 routers(见下方 [lib]),
# 使用方代码 `use routers::...` 不受影响。
name = "routers-rs"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "为 gpui-kit 桌面应用提供显式状态所有的路由器(pathname + 历史栈 + 路由守卫 + 嵌套布局 + 持久化恢复)"
keywords = ["gpui", "router", "routing", "reactive", "desktop"]
categories = ["gui"]
readme = "README.md"
repository = "https://github.com/Cambridge1995/routers-rs"

[lib]
# lib 名保持 routers:framework/demo 的 `use routers::...` 与 `routers = { package = ... }` 依赖写法不变。
name = "routers"

[dependencies]
gpui-kit = "0.9.0"
# 路由匹配引擎:Trie 实现,支持静态/动态段 {id}/通配 {*splat}。
matchit = "0.9.1"

[dev-dependencies]
gpui-kit = { version = "0.9.0", features = ["test-support"] }
